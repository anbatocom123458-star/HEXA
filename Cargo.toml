[workspace]
resolver = "2"
members = [
    "compiler",
    "crypto",
    "runtime",
    "cli",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/anbatocom123458-star/HEXA"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
